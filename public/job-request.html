<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Job Request</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <link rel="icon" href="images/logo.jpg" type="image/x-icon">
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-firestore.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.6.8/firebase-storage.js"></script>
<body>
    <div class="bg-orbs">
        <div class="bg-orb bg-orb-1"></div>
        <div class="bg-orb bg-orb-2"></div>
    </div>
    <header>
        <nav>
            <a href="index.html">
                <img src="images/logo.jpg" alt="Precision Pixel Innovations" class="logo">
            </a>
            <div class="menu-toggle" onclick="toggleSideNav()">
                <div class="bar"></div>
                <div class="bar"></div>
                <div class="bar"></div>
            </div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="portfolio.html">Portfolio</a></li>
                <li><a href="skills.html">Skills</a></li>
                <li><a href="resume.html">Resume</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div id="side-nav" class="side-nav">
                <span class="close-btn" onclick="closeSideNav()">&times;</span>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="portfolio.html">Portfolio</a></li>
                    <li><a href="skills.html">Skills</a></li>
                    <li><a href="resume.html">Resume</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </div>
        </nav>
    </header>
    <main>
        <section id="job-request">
            <a href="index.html">
                <img src="images/logo.jpg" alt="Precision Pixel Innovations" class="centered-logo">
            </a>
            <h1>Submit Job Request</h1>
            <form>
                <label for="company-name">Company Name:</label>
                <input type="text" id="company-name" name="company-name">
                <label for="client-name">Name:</label>
                <input type="text" id="client-name" name="client-name" required>
                <label for="client-email">Email:</label>
                <input type="email" id="client-email" name="client-email" required>
                <label for="project-details">Project Details:</label>
                <textarea id="project-details" name="project-details" required></textarea>
                <label for="budget">Budget:</label>
                <input type="text" id="budget" name="budget" required>
                <label for="deadline">Deadline:</label>
                <input type="date" id="deadline" name="deadline" required>
                <label for="documents">Upload Documents:</label>
                <input type="file" id="documents" name="documents" multiple>
                <button type="submit">Submit</button>
            </form>
            <div id="job-request-response" class="response-message"></div>
        </section>
    </main>
    <footer>
        <p>&copy; 2026 Dante Corso — Precision Pixel Innovations. All rights reserved.</p>
    </footer>
    <script src="js/scripts.js"></script>
</body>
</html>
