    <main>
        <section id="job-request">
            <a href="index.html">
                <img src="images/logo.jpg" alt="Precision Pixel Innovations" class="centered-logo">
            </a>
            <h1>Submit Job Request</h1>
            <form>
                <label for="company-name">Company Name:</label>
                <input type="text" id="company-name" name="company-name">
                <label for="client-name">Name:</label>
                <input type="text" id="client-name" name="client-name" required>
                <label for="client-email">Email:</label>
                <input type="email" id="client-email" name="client-email" required>
                <label for="project-details">Project Details:</label>
                <textarea id="project-details" name="project-details" required></textarea>
                <label for="budget">Budget:</label>
                <input type="text" id="budget" name="budget" required>
                <label for="deadline">Deadline:</label>
                <input type="date" id="deadline" name="deadline" required>
                <label for="documents">Upload Documents:</label>
                <input type="file" id="documents" name="documents" multiple>
                <button type="submit">Submit</button>
            </form>
            <div id="job-request-response" class="response-message"></div>
        </section>
    </main>

    </footer>
    <script src="js/scripts.js" defer></script>
    <script>
        (function(){
            function applyTheme(t){
                document.documentElement.setAttribute("data-theme",t);
                if(t==="light"){
                    document.body.style.setProperty("background","#ffffff","important");
                    document.body.style.setProperty("color","#111111","important");
                    document.documentElement.style.setProperty("background","#ffffff","important");
                    if(document.querySelector(".bg-orbs"))document.querySelector(".bg-orbs").style.setProperty("opacity","0","important");
                } else {
                    document.body.style.removeProperty("background");
                    document.body.style.removeProperty("color");
                    document.documentElement.style.removeProperty("background");
                    if(document.querySelector(".bg-orbs"))document.querySelector(".bg-orbs").style.removeProperty("opacity");
                }
            }
            var cb=document.getElementById("theme-checkbox"),thumb=document.querySelector(".theme-switch-thumb"),s=localStorage.getItem("dvg-portfolio-theme")||"dark";
            applyTheme(s);
            if(cb){cb.checked=(s==="light");if(thumb)thumb.textContent=s==="light"?"🌙":"☀️";}
            if(cb)cb.addEventListener("change",function(){var n=cb.checked?"light":"dark";applyTheme(n);if(thumb)thumb.textContent=n==="light"?"🌙":"☀️";localStorage.setItem("dvg-portfolio-theme",n);});
        })();
    </script>
</body>
